[package]
name = "desktop"
version = "0.3.3"
description = "ApiNest desktop client"
authors = ["zerunx"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "blocking", "gzip", "deflate"] }
base64 = "0.22"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
bytes = "1"
http = "1"
prost = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
protox = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tonic = { version = "0.12", default-features = false, features = ["transport", "tls-webpki-roots"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

services:
  nest:
    image: golang:1.26.3-trixie
    working_dir: /app
    ports:
      - 3000
    environment:
      TZ: Asia/Shanghai
      GIN_MODE: debug
      LOG_TO_CONSOLE: "true"
      LOG_TO_FILE: "false"
    volumes:
      - .:/app
      - mod-cache:/go/pkg/mod
      - build-cache:/root/.cache/go-build
    command: go run cmd/api/main.go
    restart: unless-stopped
    networks:
      - default
      - common-network

volumes:
  mod-cache:
  build-cache:

networks:
  default:
    external: true
    name: nest-network

  common-network:
    external: true

services:
  caddy:
    image: caddy:2

    ports:
      - "80:80"
      - "443:443"
    volumes:
      # dev
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./docker/caddy/data:/data
      - ./docker/caddy/config:/config

      # prod
      # - /data/docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      # - /data/docker/caddy/data:/data
      # - /data/docker/caddy/config:/config

    restart: unless-stopped

  postgres:
    image: postgres:18.4-trixie

    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123123
    ports:
      - "5432:5432"
    volumes:
      # dev
      - ./docker/postgres/data:/var/lib/postgresql
      # - ./docker/postgres/init:/docker-entrypoint-initdb.d

      # prod
      # - /data/docker/postgres/data:/var/lib/postgresql
      # - /data/docker/postgres/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

networks:
  default:
    name: common-network
    external: true